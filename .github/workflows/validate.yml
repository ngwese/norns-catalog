name: Validate catalog

on:
  pull_request:
    paths:
      - "entries/**"
      - "config.json"
      - "tools/**"
      - "catalog.sh"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build catalog
        run: ./catalog.sh build
