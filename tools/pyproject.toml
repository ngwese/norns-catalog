[project]
name = "catalog"
version = "0.1.0"
description = "Command-line tooling for assembling and validating norns script catalogs"
readme = "README.md"
authors = [
    { name = "Greg Wuller", email = "greg@afofo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "watchdog>=7.0.0",
]

[project.scripts]
catalog = "catalog:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
